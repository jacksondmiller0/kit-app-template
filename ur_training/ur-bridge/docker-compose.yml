# Practice setup: URSim (simulated UR10e) + read-only bridge.
# Run on any Linux Docker host (for example, your homelab).
services:
  ursim:
    image: universalrobots/ursim_e-series
    environment:
      - ROBOT_MODEL=UR10e
    ports:
      - "6080:6080"   # Virtual pendant in a browser: http://<host>:6080/vnc.html
    networks:
      ur_net:
        ipv4_address: 192.168.56.101

  bridge:
    build: ./bridge
    depends_on:
      - ursim
    environment:
      - ROBOT_IP=192.168.56.101
      - TARGET_HOST=host.docker.internal   # Where Isaac Sim (or listen.py) runs
      - TARGET_PORT=5005
      - RATE_HZ=30
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Needed on Linux; built in on Docker Desktop
    networks:
      - ur_net

networks:
  ur_net:
    ipam:
      config:
        - subnet: 192.168.56.0/24
